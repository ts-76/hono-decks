name: Browser Run smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser-run-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: browser-run-smoke
      url: ${{ vars.HONO_DECKS_BROWSER_RUN_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
          run-install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Require the protected main ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Browser Run smoke must run from main"
          exit 1
      - name: Run deployed Browser Run PDF smoke
        run: bun run smoke:browser-run
        env:
          HONO_DECKS_BROWSER_RUN_ORIGIN: ${{ vars.HONO_DECKS_BROWSER_RUN_ORIGIN }}
          HONO_DECKS_BROWSER_RUN_TOKEN: ${{ secrets.HONO_DECKS_BROWSER_RUN_TOKEN }}
          HONO_DECKS_BROWSER_RUN_ARTIFACTS: ${{ runner.temp }}/hono-decks-browser-run-smoke
      - name: Upload Browser Run PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-run-pdfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hono-decks-browser-run-smoke
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
